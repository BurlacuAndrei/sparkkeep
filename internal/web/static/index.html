<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sparkkeep</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee;
  }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: #1b1b1b; border-bottom: 1px solid #333; position: sticky; top: 0;
  }
  .topbar h1 { font-size: 18px; margin: 0 12px 0 0; }
  .topbar input, .topbar select, .topbar button, .card input, form input, form select,
  form button {
    padding: 6px 10px; border-radius: 6px; border: 1px solid #333; background: #222; color: #eee;
  }
  .topbar button, form button { cursor: pointer; }
  .topbar button:hover, .card button:hover { background: #333; }
  #digest-btn.on { background: #2d4a57; border-color: #9cdcfe; }
  #flash { color: #8ab4f8; font-size: 13px; }
  .layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; padding: 16px; }
  .rail { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  .rail label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #aaa; }
  .rail .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .rail .chip {
    padding: 4px 8px; border-radius: 999px; border: 1px solid #333; background: #222;
    color: #9cdcfe; font-size: 12px; cursor: pointer;
  }
  .rail .chip.active { background: #2d4a57; border-color: #9cdcfe; }
  #new-card-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .hidden { display: none !important; }
  h2 { font-size: 15px; margin: 18px 0 8px; color: #bbb; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
  .card {
    background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 10px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card h3 { margin: 0; font-size: 15px; }
  .card p { margin: 0; font-size: 13px; color: #bbb; line-height: 1.4; }
  .card-top { display: flex; justify-content: space-between; font-size: 11px; text-transform: uppercase; }
  .card .horizon { padding: 2px 6px; border-radius: 4px; }
  .card .horizon.short-term { background: #2d4a2d; color: #8aff8a; }
  .card .horizon.lifetime { background: #4a3f2d; color: #ffd88a; }
  .card .status { color: #999; }
  .card .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .card .tag { font-size: 12px; color: #9cdcfe; }
  .card .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .card .acts button { font-size: 12px; padding: 4px 8px; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .boards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="topbar">
  <h1>sparkkeep</h1>
  <input id="q" type="search" placeholder="search title/summary…">
  <button id="new-card-btn" type="button">+ New card</button>
  <button id="digest-btn" type="button">Weekly digest</button>
  <input id="research-id" type="number" min="1" placeholder="card id">
  <button id="research-btn" type="button">Research</button>
  <span id="flash"></span>
</header>
<div class="layout">
  <aside class="rail">
    <label>Horizon
      <select id="horizon">
        <option value="all">all</option>
        <option value="short-term">short-term</option>
        <option value="lifetime">lifetime</option>
      </select>
    </label>
    <label>Status
      <select id="status">
        <option value="all">all</option>
        <option value="inbox">inbox</option>
        <option value="doing">doing</option>
        <option value="done">done</option>
        <option value="shelved">shelved</option>
        <option value="dismissed">dismissed</option>
      </select>
    </label>
    <div class="chips" id="rail-tags"></div>
  </aside>
  <main>
    <form id="new-card-form" class="hidden">
      <input name="title" placeholder="title *" required>
      <input name="summary" placeholder="summary">
      <select name="horizon">
        <option value="short-term">short-term</option>
        <option value="lifetime">lifetime</option>
      </select>
      <select name="status">
        <option value="inbox">inbox</option>
        <option value="doing">doing</option>
        <option value="done">done</option>
        <option value="shelved">shelved</option>
      </select>
      <input name="source_url" placeholder="source url">
      <input name="source_note" placeholder="source note">
      <input name="tags" placeholder="tags, comma, separated">
      <button type="submit">Save</button>
      <button type="button" id="cancel-new">Cancel</button>
    </form>
    <h2 id="main-heading">Main grid</h2>
    <div id="main-grid" class="grid"></div>
    <div class="boards">
      <section><h2>Action queue</h2><div id="action-board" class="grid"></div></section>
      <section><h2>Bucket list</h2><div id="bucket-board" class="grid"></div></section>
    </div>
  </main>
</div>
<script src="/assets/app.js" defer></script>
</body>
</html>
