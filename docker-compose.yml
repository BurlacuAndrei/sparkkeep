services:
  sparkkeep:
    build: .
    image: sparkkeep:latest
    container_name: sparkkeep
    restart: unless-stopped
    ports:
      - "${SPARKKEEP_HTTP_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host Ollama or local LLMs

  # (Optional) Private SearXNG instance for deep research playbooks.
  # To enable, uncomment and set SPARKKEEP_SEARCH_URL=http://searxng:8080 in .env
  # searxng:
  #   image: docker.io/searxng/searxng:latest
  #   container_name: sparkkeep_searxng
  #   restart: unless-stopped
  #   environment:
  #     - SEARXNG_BASE_URL=http://searxng:8080/
  #   volumes:
  #     - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
