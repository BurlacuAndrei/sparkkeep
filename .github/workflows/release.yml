name: Release Binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Binary (${{ matrix.targetos }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - targetos: linux
            arch: amd64
            ext: ""
          - targetos: linux
            arch: arm64
            ext: ""
          - targetos: darwin
            arch: amd64
            ext: ""
          - targetos: darwin
            arch: arm64
            ext: ""
          - targetos: windows
            arch: amd64
            ext: ".exe"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Build Frontend Assets
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build Binary
        env:
          GOOS: ${{ matrix.targetos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          BINARY_NAME="sparkkeep-${{ matrix.targetos }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "dist/$BINARY_NAME" ./cmd/sparkkeep

      - name: Package Release Asset
        run: |
          cd dist
          ARCHIVE_NAME="sparkkeep-${{ github.ref_name }}-${{ matrix.targetos }}-${{ matrix.arch }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" sparkkeep-*
          echo "ASSET_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkkeep-${{ matrix.targetos }}-${{ matrix.arch }}
          path: dist/*.tar.gz

  publish-github-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
